buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1' //Consider updating to latest stable version
        classpath 'gradle.plugin.com.onesignal:onesignal-gradle-plugin:0.14.0' 
        //classpath 'com.huawei.agconnect:agcp:1.9.3.301' // Add this line to include the Huawei AGConnect plugin
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.onesignal.androidsdk.onesignal-gradle-plugin" version "0.14.0"
    //id "com.huawei.agconnect"
}


android {
    //compileSdkVersion 33
    compileSdkVersion 35
    //ndkVersion flutter.ndkVersion
    ndkVersion = "27.0.12077973"
    namespace = "com.loopin.nepalayluya"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.loopin.nepalayluya"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1 // Default value
        versionName "1.0" // Default value
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            //These will be populated later
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    //implementation 'com.huawei.agconnect:agconnect-core:1.5.2.300'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}


// Load properties AFTER android block to ensure plugins are applied
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { input ->
        localProperties.load(input)
    }
    //Now safe to access properties
    def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
    def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
    android.defaultConfig.versionCode = flutterVersionCode.toInteger()
    android.defaultConfig.versionName = flutterVersionName
} else {
    //Handle the exception more gracefully, perhaps by logging a warning instead of crashing the build
    logger.warn("Could not find local.properties file. Using default version.")
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    android.signingConfigs.release.keyAlias = keystoreProperties['keyAlias']
    android.signingConfigs.release.keyPassword = keystoreProperties['keyPassword']
    android.signingConfigs.release.storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    android.signingConfigs.release.storePassword = keystoreProperties['storePassword']
} else {
    logger.warn("Could not find key.properties file. Skipping signing config.")
}