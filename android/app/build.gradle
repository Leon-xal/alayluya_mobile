buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1' //Consider updating to latest stable version
        classpath 'gradle.plugin.com.onesignal:onesignal-gradle-plugin:0.14.0' 
    }
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // This MUST be before other plugins
    id "com.onesignal.androidsdk.onesignal-gradle-plugin" version "0.14.0"
}


android {
    compileSdkVersion 36
    ndkVersion = "27.0.12077973"
    namespace = "com.loopin.nepalayluya"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.loopin.nepalayluya"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 33
        versionCode 1 // Default value
        versionName "1.0" // Default value
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            //keyAlias keystoreProperties['keyAlias']
            //keyPassword keystoreProperties['keyPassword']
            //storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            //storePassword keystoreProperties['storePassword']
            //These will be populated later
            storeFile file("upload-keystore.jks") // Replace with your keystore path
            storePassword "123456" // Replace with your keystore password
            keyAlias "upload" // Replace with your key alias
            keyPassword "123456" // Replace with your key password
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    //Remove these lines; Flutter plugin handles them
    //implementation("io.flutter:flutter_embedding_android:{$flutterEmbeddingVersion}") 
    //implementation("io.flutter:flutter_plugin_android_lifecycle:{$flutterPluginAndroidLifecycleVersion}") 

    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
}


// Load properties AFTER android block to ensure plugins are applied
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { input ->
        localProperties.load(input)
    }
    //Now safe to access properties
    def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
    def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'
    android.defaultConfig.versionCode = flutterVersionCode.toInteger()
    android.defaultConfig.versionName = flutterVersionName
} else {
    //Handle the exception more gracefully, perhaps by logging a warning instead of crashing the build
    logger.warn("Could not find local.properties file. Using default version.")
}


def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    android.signingConfigs.release.keyAlias = keystoreProperties['keyAlias']
    android.signingConfigs.release.keyPassword = keystoreProperties['keyPassword']
    android.signingConfigs.release.storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
    android.signingConfigs.release.storePassword = keystoreProperties['storePassword']
} else {
    logger.warn("Could not find key.properties file. Skipping signing config.")
}